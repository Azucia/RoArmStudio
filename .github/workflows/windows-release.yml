name: Windows release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'source/version.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and run tests
        shell: pwsh
        run: |
          python -m pip install -r source/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:QT_QPA_PLATFORM='offscreen'
          python -m unittest discover -s source
      - name: Build Windows program
        run: python source/build.py
      - name: Build and smoke-test per-user installer
        shell: pwsh
        run: |
          $root=(Get-Location).Path
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DSourceRoot=$root" "/DReleaseOutput=$root\dist" source/installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup=Get-Item dist/RoarmStudio-1.0-Setup-x64.exe
          $dest=Join-Path $env:RUNNER_TEMP 'installed-studio'
          $proc=Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$dest`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed: $($proc.ExitCode)" }
          $env:QT_QPA_PLATFORM='offscreen'
          $proc=Start-Process "$dest\RoarmStudio.exe" -ArgumentList '--smoke' -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or !(Test-Path "$dest\界面预览.png")) { Get-Content "$dest\runtime.log"; throw 'Installed GUI smoke test failed' }
      - name: Assemble packages and publish version 1.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir='程序/RoarmStudio'
          Copy-Item -Recurse licenses "$dir/licenses"
          Copy-Item 使用说明.md,THIRD_PARTY_NOTICES.md $dir
          Compress-Archive "$dir/*" dist/RoarmStudio-1.0-Windows-x64.zip
          Copy-Item firmware/RoarmStudio-1.0-Teach-app.bin dist/
          $sums=Get-ChildItem dist -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          $files=Get-ChildItem dist -File | ForEach-Object FullName
          gh release create v1.0 @files --target $env:GITHUB_SHA --title 'RoarmStudio 1.0' --notes-file docs/release-1.0.md --latest
